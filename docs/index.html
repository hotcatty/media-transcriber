<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>转录小工具</title>
  <meta name="description" content="把小宇宙 / B 站 / YouTube 分享链接转成简体逐字稿。">
  <link rel="stylesheet" href="./door.css">
</head>
<body>
  <div class="stage">
    <header class="support">
      <p class="support-title">支持链接</p>
      <div class="support-icons">
        <img src="./img/icon-xiaoyuzhou.png" alt="小宇宙" width="24" height="24">
        <img src="./img/icon-bilibili.png" alt="B站" width="24" height="24">
        <img src="./img/icon-youtube.svg" alt="YouTube" class="icon-youtube" width="98" height="18">
      </div>
    </header>

    <div class="desk">
      <form class="card" id="mainCard" novalidate>
        <div class="bar">
          <div class="url-wrap">
            <input id="urlInput" class="url-input" type="text" inputmode="url" autocomplete="off"
              placeholder="粘贴小宇宙/B 站/ YouTube 网址链接">
          </div>
          <button type="submit" class="btn btn--solid btn--submit" id="submitBtn">
            转录为逐字稿
          </button>
        </div>
      </form>
      <button type="button" class="link link--on-dark" id="historyBtn">查看历史记录</button>
    </div>
  </div>
  <script src="./door.js"></script>
</body>
</html>
